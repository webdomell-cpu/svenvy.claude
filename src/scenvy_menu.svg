<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="60" y1="60" x2="452" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="508" height="508" rx="94" stroke="url(#accentGrad)" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="200" r="120" fill="url(#accentGrad)" opacity="0.22" filter="url(#glow)"/>

  <!-- Icon: Menu & Cloche/QR -->
  <g transform="translate(156, 100)">
    <rect x="0" y="0" width="200" height="200" rx="48" fill="url(#accentGrad)"/>
    <rect x="6" y="6" width="188" height="188" rx="42" fill="#090D16" fill-opacity="0.85"/>
    
    <!-- Cloche Dome -->
    <path d="M50 120 C50 75 150 75 150 120 Z" fill="none" stroke="url(#accentGrad)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="100" cy="70" r="10" fill="url(#accentGrad)"/>
    <line x1="40" y1="125" x2="160" y2="125" stroke="url(#accentGrad)" stroke-width="10" stroke-linecap="round"/>
    <!-- Menu Lines / Sparkles -->
    <line x1="65" y1="148" x2="135" y2="148" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8"/>
  </g>

  <!-- Typography -->
  <text x="256" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="40" fill="#FFFFFF" letter-spacing="2">
    SCENVY
  </text>
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#F59E0B" letter-spacing="6">
    MENU
  </text>
  <text x="256" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="14" fill="#94A3B8" letter-spacing="1">
    Smart Digital AI Gastro Menu
  </text>
</svg>
