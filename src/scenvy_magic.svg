<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="60" y1="60" x2="452" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="508" height="508" rx="94" stroke="url(#accentGrad)" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="200" r="120" fill="url(#accentGrad)" opacity="0.25" filter="url(#glow)"/>

  <!-- Icon: Magic AI Wand & Multi Star Sparkles -->
  <g transform="translate(156, 100)">
    <rect x="0" y="0" width="200" height="200" rx="48" fill="url(#accentGrad)"/>
    <rect x="6" y="6" width="188" height="188" rx="42" fill="#090D16" fill-opacity="0.85"/>
    
    <!-- Central AI Sparkle Star -->
    <path d="M100 45 L108 82 L145 90 L108 98 L100 135 L92 98 L55 90 L92 82 Z" fill="url(#accentGrad)"/>
    <!-- Secondary Sparkles -->
    <path d="M145 130 L149 146 L165 150 L149 154 L145 170 L141 154 L125 150 L141 146 Z" fill="#FFFFFF"/>
    <path d="M55 135 L58 147 L70 150 L58 153 L55 165 L52 153 L40 150 L52 147 Z" fill="url(#accentGrad)"/>
  </g>

  <!-- Typography -->
  <text x="256" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="40" fill="#FFFFFF" letter-spacing="2">
    SCENVY
  </text>
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#A855F7" letter-spacing="6">
    MAGIC AI
  </text>
  <text x="256" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="14" fill="#94A3B8" letter-spacing="1">
    Autonomous Neural Content Generation
  </text>
</svg>
