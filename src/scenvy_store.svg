<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="60" y1="60" x2="452" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="508" height="508" rx="94" stroke="url(#accentGrad)" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="200" r="120" fill="url(#accentGrad)" opacity="0.22" filter="url(#glow)"/>

  <!-- Icon: Shopping Bag -->
  <g transform="translate(156, 100)">
    <rect x="0" y="0" width="200" height="200" rx="48" fill="url(#accentGrad)"/>
    <rect x="6" y="6" width="188" height="188" rx="42" fill="#090D16" fill-opacity="0.85"/>
    
    <!-- Bag Body -->
    <rect x="50" y="70" width="100" height="85" rx="16" fill="none" stroke="url(#accentGrad)" stroke-width="8"/>
    <!-- Handles -->
    <path d="M75 70 C75 45 125 45 125 70" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round"/>
    <!-- Sparkle inside Bag -->
    <path d="M100 95 L103 107 L115 110 L103 113 L100 125 L97 113 L85 110 L97 107 Z" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <text x="256" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="40" fill="#FFFFFF" letter-spacing="2">
    SCENVY
  </text>
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#F43F5E" letter-spacing="6">
    STORE
  </text>
  <text x="256" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="14" fill="#94A3B8" letter-spacing="1">
    E-Commerce & Voucher Checkout
  </text>
</svg>
