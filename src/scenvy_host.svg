<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="60" y1="60" x2="452" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="508" height="508" rx="94" stroke="url(#accentGrad)" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="200" r="120" fill="url(#accentGrad)" opacity="0.22" filter="url(#glow)"/>

  <!-- Icon: Service Bell & Key Card -->
  <g transform="translate(156, 100)">
    <rect x="0" y="0" width="200" height="200" rx="48" fill="url(#accentGrad)"/>
    <rect x="6" y="6" width="188" height="188" rx="42" fill="#090D16" fill-opacity="0.85"/>
    
    <!-- Concierge Bell Dome -->
    <path d="M55 120 C55 80 145 80 145 120 Z" fill="none" stroke="url(#accentGrad)" stroke-width="10"/>
    <circle cx="100" cy="72" r="8" fill="url(#accentGrad)"/>
    <line x1="45" y1="125" x2="155" y2="125" stroke="url(#accentGrad)" stroke-width="10" stroke-linecap="round"/>
    <rect x="75" y="132" width="50" height="14" rx="4" fill="url(#accentGrad)"/>
    <path d="M100 50 L100 64" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="256" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="40" fill="#FFFFFF" letter-spacing="2">
    SCENVY
  </text>
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#10B981" letter-spacing="6">
    HOST
  </text>
  <text x="256" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="14" fill="#94A3B8" letter-spacing="1">
    Guest Experience & Digital Concierge
  </text>
</svg>
